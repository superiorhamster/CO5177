name: Deploy assignment portfolio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".nojekyll"
      - "pages/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build shared header and footer
        run: python3 scripts/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website artifact
        env:
          SITE_DIR: ${{ runner.temp }}/github-pages-site
        run: |
          mkdir -p "$SITE_DIR"
          cp index.html .nojekyll "$SITE_DIR/"
          cp -R pages "$SITE_DIR/pages"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/github-pages-site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
