<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#0747A6"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#bkGrad)" stroke-width="8"/>
  <circle cx="100" cy="100" r="82" fill="#0052CC" fill-opacity="0.06"/>
  <!-- Central Gear & Book Emblem -->
  <g transform="translate(100,100) scale(0.85)">
    <!-- Stylized Hexagonal Gear -->
    <path d="M-25,-70 L25,-70 L35,-50 L65,-35 L80,-5 L75,30 L55,55 L25,75 L-25,75 L-55,55 L-75,30 L-80,-5 L-65,-35 L-35,-50 Z" 
          fill="none" stroke="#0052CC" stroke-width="6" stroke-linejoin="round"/>
    <!-- Center Core -->
    <circle cx="0" cy="0" r="28" fill="#0052CC"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <!-- Radiating spokes -->
    <line x1="0" y1="-55" x2="0" y2="-28" stroke="#0052CC" stroke-width="6"/>
    <line x1="0" y1="28" x2="0" y2="55" stroke="#0052CC" stroke-width="6"/>
    <line x1="-50" y1="0" x2="-28" y2="0" stroke="#0052CC" stroke-width="6"/>
    <line x1="28" y1="0" x2="50" y2="0" stroke="#0052CC" stroke-width="6"/>
    <line x1="-35" y1="-35" x2="-20" y2="-20" stroke="#0052CC" stroke-width="6"/>
    <line x1="20" y1="20" x2="35" y2="35" stroke="#0052CC" stroke-width="6"/>
    <line x1="35" y1="-35" x2="20" y2="-20" stroke="#0052CC" stroke-width="6"/>
    <line x1="-20" y1="20" x2="-35" y2="35" stroke="#0052CC" stroke-width="6"/>
  </g>
  <!-- Text HCMUT -->
  <text x="100" y="172" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#0052CC" text-anchor="middle" letter-spacing="3">HCMUT</text>
</svg>
