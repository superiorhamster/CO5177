<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#cseGrad)"/>
  <!-- Circuit Nodes & Code Brackets Motif -->
  <g stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bracket Left -->
    <path d="M65 65 L45 100 L65 135"/>
    <!-- Bracket Right -->
    <path d="M135 65 L155 100 L135 135"/>
    <!-- Central Slash / Node Network -->
    <line x1="110" y1="65" x2="90" y2="135"/>
    <!-- Circuit lines & points -->
    <circle cx="100" cy="100" r="10" fill="#38BDF8"/>
    <circle cx="45" cy="100" r="5" fill="#FFFFFF"/>
    <circle cx="155" cy="100" r="5" fill="#FFFFFF"/>
  </g>
  <!-- Text CSE -->
  <text x="100" y="168" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CSE</text>
</svg>
